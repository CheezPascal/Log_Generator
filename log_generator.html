<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Log Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 20px;
        }

        .text-box {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .text-display {
            flex: 1;
            background-color: #f4f4f4;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            margin-right: 10px;
            height: 100px;
            overflow-y: auto;
        }

        .bigger-box {
            border: 2px solid #403399;
            padding: 20px;
            border-radius: 10px;
            background-color: #f9f9f9;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bigger-box">
            <h1 class="text-center mb-4">Skills Log Generator</h1>

            <div class="text-box">
                <div id="box1" class="text-display"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="randomizeText('box1', 'file_A.txt')">Randomize</button>
                    <button class="btn btn-secondary" onclick="copyText('box1')">Copy</button>
                </div>
            </div>

            <div class="text-box">
                <div id="box2" class="text-display"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="randomizeText('box2', 'file_B.txt')">Randomize</button>
                    <button class="btn btn-secondary" onclick="copyText('box2')">Copy</button>
                </div>
            </div>

            <div class="text-box">
                <div id="box3" class="text-display"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="randomizeText('box3', 'file_C.txt')">Randomize</button>
                    <button class="btn btn-secondary" onclick="copyText('box3')">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchFile(fileName) {
            const response = await fetch(fileName);
            const text = await response.text();
            return text.split('\n').map(line => line.trim()).filter(line => line);
        }

        async function randomizeText(boxId, fileName) {
            const lines = await fetchFile(fileName);
            const randomLine = lines[Math.floor(Math.random() * lines.length)];
            document.getElementById(boxId).textContent = randomLine;
        }

        function copyText(boxId) {
            const text = document.getElementById(boxId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Text copied to clipboard!');
            });
        }

        // Initialize boxes with random text
        randomizeText('box1', 'file_A.txt');
        randomizeText('box2', 'file_B.txt');
        randomizeText('box3', 'file_C.txt');
    </script>
</body>

</html>
